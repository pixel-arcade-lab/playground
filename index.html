<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kartik's Playground</title>
  <style>
    :root { --bg: #14161c; --card: #1f232d; --text: #eef0f4; --muted: #9aa3b2; --accent: #f39aa0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 48px 16px; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 32px; }
    .intro { color: var(--muted); margin: 0 0 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    a.card { display: block; background: var(--card); border-radius: 12px; padding: 20px; color: inherit; text-decoration: none; border: 1px solid #2c3240; transition: transform 0.15s, border-color 0.15s; }
    a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .card h2 { margin: 0 0 6px; font-size: 20px; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .tag { display: inline-block; margin-top: 12px; font-size: 12px; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Kartik's Playground</h1>
    <p class="intro">Small games and experiments that run right in your browser. Built step by step.</p>
    <div class="grid">
      <a class="card" href="projects/city-walker/">
        <h2>City Walker — Kyoto</h2>
        <p>Walk around a pixel-art Kyoto school. Visit the classroom, the dojo, and the underground cursed tool storage.</p>
        <span class="tag">3D · Three.js · Play now →</span>
      </a>
    </div>
  </main>
</body>
</html>
